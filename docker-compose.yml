version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER environment variable must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set and cannot use default passwords}
      POSTGRES_DB: ${POSTGRES_DB:-utctravel_crm}
    # Security: Database is NOT publicly exposed to the host. Accessible only via internal Docker network.
    expose:
      - '5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - utc-internal-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-utctravel_crm}?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be provided in production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be provided in production}
      # Meta Business Suite Integration Variables
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v21.0}
      - META_ENCRYPTION_SECRET=${META_ENCRYPTION_SECRET:?META_ENCRYPTION_SECRET must be a permanent persistent secret in production}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN:?META_VERIFY_TOKEN must be provided in production}
    # Security: Backend is accessible within internal network; frontend Nginx proxies public /api requests.
    expose:
      - '5000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - utc-internal-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      # Public reverse proxy entry point for web traffic and HTTPS webhooks
      - '80:80'
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    networks:
      - utc-internal-network

volumes:
  pgdata:
    driver: local

networks:
  utc-internal-network:
    driver: bridge
